# Only rendered when auth.createSecret is true (quickstart convenience — see values.yaml's
# comment on why createSecret:false + an externally-managed Secret is preferred beyond a lab).
{{- if .Values.auth.createSecret }}
{{- /* Keep the generated values across `helm upgrade`: reuse the live Secret's (a fresh randAlphaNum on
       every upgrade would log everyone out and change the admin password). `helm template` cannot
       `lookup`, so it renders throwaway values. */}}
{{- $existing := lookup "v1" "Secret" (include "atlas.namespace" .) (printf "%s-auth" (include "atlas.fullname" .)) }}
{{- $jwt := "" }}
{{- $pw := "" }}
{{- if and $existing $existing.data }}
{{- $jwt = index $existing.data "jwt-secret" | b64dec }}
{{- $pw = index $existing.data "admin-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.fullname" . }}-auth
  namespace: {{ include "atlas.namespace" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.auth.jwtSecret | default (default (randAlphaNum 48) $jwt) | quote }}
  admin-password: {{ .Values.auth.adminPassword | default (default (randAlphaNum 24) $pw) | quote }}
  {{- if .Values.auth.bootstrapAdminToken }}
  bootstrap-admin-token: {{ .Values.auth.bootstrapAdminToken | quote }}
  {{- end }}
{{- end }}
