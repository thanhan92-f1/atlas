# Credentials Secret for the in-chart RustFS server (the server itself is RustFS's official chart,
# see Chart.yaml / values `rustfsserver`). Generated once and kept on upgrade.
{{- if and .Values.rustfs.enabled .Values.rustfs.server.enabled }}
{{- if ne .Values.rustfsserver.secret.existingSecret .Values.rustfs.credentialsSecret }}
{{- fail "rustfsserver.secret.existingSecret must equal rustfs.credentialsSecret" }}
{{- end }}
{{- if .Values.rustfs.server.generateCredentials }}
{{- $ns := include "atlas.namespace" . }}
{{- $existing := lookup "v1" "Secret" $ns .Values.rustfs.credentialsSecret }}
{{- $ak := randAlphaNum 20 | b64enc }}
{{- $sk := randAlphaNum 40 | b64enc }}
{{- if and $existing $existing.data }}
{{- $ak = index $existing.data "AWS_ACCESS_KEY_ID" }}
{{- $sk = index $existing.data "AWS_SECRET_ACCESS_KEY" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rustfs.credentialsSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    # Never delete the credential (and with it access to stored objects) on `helm uninstall`.
    helm.sh/resource-policy: keep
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ $ak }}
  AWS_SECRET_ACCESS_KEY: {{ $sk }}
  RUSTFS_ACCESS_KEY: {{ $ak }}
  RUSTFS_SECRET_KEY: {{ $sk }}
{{- end }}
{{- end }}
