# Optional in-chart RustFS server (rustfs.server.enabled). Templated mirror of
# deploy/rustfs-lab/deployment.yaml — keep the two in sync. Single replica, single volume: a LAB
# topology, not HA (see docs/RUSTFS.md).
{{- if and .Values.rustfs.enabled .Values.rustfs.server.enabled }}
{{- $ns := include "atlas.namespace" . }}
{{- if .Values.rustfs.server.generateCredentials }}
{{- /* Generate once, keep on upgrade: reuse the live Secret's values when it already exists. Under
       `helm template` / --dry-run lookup returns nothing, so a throwaway value is rendered. */}}
{{- $existing := lookup "v1" "Secret" $ns .Values.rustfs.credentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rustfs.credentialsSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    # Never delete the credential (and with it access to stored objects) on `helm uninstall`.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  AWS_ACCESS_KEY_ID: {{ index $existing.data "AWS_ACCESS_KEY_ID" }}
  AWS_SECRET_ACCESS_KEY: {{ index $existing.data "AWS_SECRET_ACCESS_KEY" }}
  {{- else }}
  AWS_ACCESS_KEY_ID: {{ randAlphaNum 20 | b64enc }}
  AWS_SECRET_ACCESS_KEY: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: {{ $ns }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.rustfs.server.storageClassName }}
  storageClassName: {{ .Values.rustfs.server.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rustfs.server.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: {{ $ns }}
  labels:
    app: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # Recreate: the data PVC is ReadWriteOnce, so the old pod must release it before the new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      # The RustFS image runs as a non-root user (uid/gid 10001); fsGroup makes the volume writable for it.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.server.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: RUSTFS_VOLUMES
              value: "/data"
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: "info"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: "/logs"
            # Browsers PUT/GET objects straight to this S3 port with presigned URLs from the
            # console's origin; without an allowed origin RustFS sends no CORS headers and every
            # browser upload fails. Scoped to the console origin, never "*".
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: {{ .Values.rustfs.server.corsOrigin | default (printf "http://$(NODE_IP):%d" (int .Values.service.httpNodePort)) | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: {{ $ns }}
  labels:
    app: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.rustfs.server.s3NodePort }}
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: {{ .Values.rustfs.server.consoleNodePort }}
{{- end }}
