# ServiceAccount + namespaced Role for the throwaway installer Job the console launches to
# `helm install` RustFS's official chart (crates/atlas-jobs/src/dispatch/rustfs_instance.rs), scoped to
# what that chart renders — the gateway itself never gets these rights.
{{- $ns := include "atlas.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-rustfs-installer
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-rustfs-installer
  namespace: {{ $ns }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-rustfs-installer
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-rustfs-installer
subjects:
  - kind: ServiceAccount
    name: atlas-rustfs-installer
    namespace: {{ $ns }}
