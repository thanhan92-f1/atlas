#
# Real-Ceph Atlas gateway for the DR-lab cluster (rook-ceph-dr). Same shape as
# deploy/k8s/atlas-gateway-ceph.yaml, minus the demo backends, RGW and self-state backup; its
# SQLite catalog lives in an emptyDir because it only exists for the mirroring drill.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-gateway
  namespace: rook-ceph-dr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-gateway-readonly-ceph-dr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: atlas-gateway
    namespace: rook-ceph-dr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-gateway-ceph
  namespace: rook-ceph-dr
  labels:
    app: atlas-gateway-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-gateway-ceph
  template:
    metadata:
      labels:
        app: atlas-gateway-ceph
    spec:
      serviceAccountName: atlas-gateway
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render-ceph-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mon_host=$(echo "$MON_ENDPOINTS" | tr ',' '\n' | sed 's/^[^=]*=//' | paste -sd, -)
              printf '[global]\nmon_host = %s\n[client.admin]\nkeyring = /etc/ceph/keyring\n' "$mon_host" > /etc/ceph/ceph.conf
              printf '[%s]\nkey = %s\n' "$CEPH_USER" "$CEPH_KEY" > /etc/ceph/keyring
              chown -R 10001:10001 /etc/ceph
              chmod 0600 /etc/ceph/keyring
          env:
            - name: MON_ENDPOINTS
              valueFrom:
                configMapKeyRef: { name: rook-ceph-mon-endpoints, key: data }
            - name: CEPH_USER
              valueFrom:
                secretKeyRef: { name: rook-ceph-mon, key: ceph-username }
            - name: CEPH_KEY
              valueFrom:
                secretKeyRef: { name: rook-ceph-mon, key: ceph-secret }
          volumeMounts:
            - { name: ceph-config, mountPath: /etc/ceph }
      containers:
        - name: atlas-gateway
          image: localhost/atlas-gateway:ceph
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          env:
            - { name: ATLAS_BIND_ADDR, value: "0.0.0.0:5110" }
            - { name: ATLAS_GRPC_ADDR, value: "0.0.0.0:5111" }
            - { name: ATLAS_DATABASE_URL, value: "sqlite:///var/lib/atlas/atlas.db?mode=rwc" }
            - { name: ATLAS_CEPH_DRIVER_MODE, value: "real" }
            - { name: ATLAS_AUTH_REQUIRED, value: "1" }
            - name: ATLAS_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: atlas-gateway-auth, key: jwt-secret }
            - name: ATLAS_BOOTSTRAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: atlas-gateway-auth, key: bootstrap-admin-token }
            - { name: ATLAS_ADMIN_USERNAME, value: "admin" }
            - name: ATLAS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: atlas-gateway-auth, key: admin-password }
            - { name: RUST_LOG, value: "info,atlas_gateway=debug,atlas_driver_ceph=debug" }
          ports:
            - containerPort: 5110
          readinessProbe:
            httpGet: { path: /livez, port: 5110 }
            periodSeconds: 10
          volumeMounts:
            - { name: ceph-config, mountPath: /etc/ceph, readOnly: true }
            - { name: data, mountPath: /var/lib/atlas }
      volumes:
        - { name: ceph-config, emptyDir: {} }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-gateway-ceph
  namespace: rook-ceph-dr
spec:
  type: NodePort
  selector:
    app: atlas-gateway-ceph
  ports:
    - { name: http, port: 5110, targetPort: 5110, nodePort: 30521 }
