# Values for RustFS's OFFICIAL Helm chart (https://charts.rustfs.com, vendored at
# deploy/helm/atlas/charts/rustfs-1.0.0.tgz), standalone mode, with the data on a drive prepared
# from the console's Disks page ("RustFS drive"): that flow leaves a PVC named `rustfs-<disk>-data`
# bound to the disk's local PV. Used by scripts/rustfs-drive-remote.sh, which passes the PVC name,
# credentials Secret, ports and CORS origin on the command line.
image:
  tag: "1.0.0"
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false
ingress:
  enabled: false   # the chart renders an nginx Ingress for example.rustfs.com by default
service:
  type: NodePort
