# RustFS (https://github.com/rustfs/rustfs) — the S3-compatible object store Atlas uses as its
# primary object backend. Single replica, single volume: a lab target that exercises Atlas's real
# RustFS write path (bucket create/delete, presigned upload/download), not an HA topology — a
# production RustFS wants multiple drives/nodes (erasure coding); see docs/RUSTFS.md.
#
# Credentials come from Secret `rustfs-credentials` (created by up.sh, never committed). It uses the
# same key names (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) Atlas's write path already reads for
# every S3 target, so the one Secret is both the server's root credential and Atlas's service
# credential. (Lab shortcut: a production deploy should give Atlas its own least-privilege IAM
# user rather than reusing the root key.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: zyvor-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: zyvor-system
  labels:
    app: rustfs
spec:
  replicas: 1
  # Recreate: the data PVC is ReadWriteOnce, so the old pod must release it before the new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      # The RustFS image runs as a non-root user (uid/gid 10001); fsGroup makes the volume writable for it.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          # Pinned (not :latest) so a lab redeploy can't silently pick up a different server build.
          image: rustfs/rustfs:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: RUSTFS_VOLUMES
              value: "/data"
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: "info"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: "/logs"
            # Browsers PUT/GET objects straight to this S3 port using the presigned URLs Atlas hands
            # the console, from a *different origin* (the console is served from the gateway's
            # NodePort 30510) — so without this RustFS answers the CORS preflight with no
            # Access-Control-Allow-* headers and every browser upload fails ("Failed to fetch").
            # Default is empty = no CORS headers. Scoped to exactly the console's origin, not "*".
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: "http://$(NODE_IP):30510"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: {}
---
# NodePorts (like the RGW NodePort 30800 and the gateway's 30510): the S3 API must be reachable from
# BROWSERS at a stable address, because Atlas hands the console presigned PUT/GET URLs and the
# object bytes go straight browser <-> RustFS, never through atlas-gateway.
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: zyvor-system
  labels:
    app: rustfs
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
